name: build

permissions:
  contents: read

# Skip runs for changes that can't affect the image or the checks (docs, license, git and
# Renovate config; Renovate reports its own config errors in an issue)
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".gitignore", "renovate.json"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".gitignore", "renovate.json"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # devc edits devcontainer.json with jq, which rejects comments and other JSONC
      - name: devcontainer-json
        run: jq -e . devcontainer.json >/dev/null
      - name: shellcheck
        run: shellcheck -S warning install.sh .zshrc
      # Like the image's tools, ruff's newest release that is at least 10 days old
      - name: ruff
        run: |
          pipx run --pip-args=--uploaded-prior-to=P10D ruff check post_install.py
          pipx run --pip-args=--uploaded-prior-to=P10D ruff format --check --diff post_install.py
      # DL3008 (pin apt package versions) doesn't suit a dev image
      - name: hadolint
        run: >-
          docker run --rm -i
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint --failure-threshold warning --ignore DL3008 - < Dockerfile

  # Install the template into a scratch git workspace the way devc does, then build,
  # start, and check the container, on both architectures
  smoke:
    name: smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Like the image's tools, the CLI's newest release that is at least 10 days old (with --before,
      # since the runner's npm predates min-release-age)
      - name: install devcontainers cli
        # zizmor: ignore[adhoc-packages] -- devc needs the CLI; the job has a read-only token and no secrets
        run: npm install -g @devcontainers/cli@0 --before="$(date -u -d '10 days ago' +%Y-%m-%dT%H:%M:%SZ)"
      - name: install template
        run: |
          mkdir -p "$RUNNER_TEMP/ws"
          git -C "$RUNNER_TEMP/ws" init -q
          ./install.sh template "$RUNNER_TEMP/ws"
      - name: build and start container
        run: ./install.sh up "$RUNNER_TEMP/ws"
      - name: check container
        run: |
          # shellcheck disable=SC2016 # expanded by the container's bash, not here
          devcontainer exec --workspace-folder "$RUNNER_TEMP/ws" bash -c '
            set -euxo pipefail
            test "$(pwd)" = /workspaces/ws
            test "$(id -un)" = vscode
            claude --version
            jq -e ".permissions.defaultMode == \"bypassPermissions\"" ~/.claude/settings.json
            jq -e ".autoUpdatesChannel == \"stable\"" ~/.claude/settings.json
            test -f ~/.gitconfig.local
            # dotfiles are opt-in, and CI sets no DEVC_DOTFILES_REPO
            test ! -e ~/.dotfiles
            test -f ~/.tmux.conf
            test "$(git config --global --get core.checkStat)" = minimal
            test "$(git config --global --get core.trustctime)" = false
            git config --global --get-all credential.https://github.com.helper | grep -Fx "!gh auth git-credential" >/dev/null
            # set -e ignores commands negated with !, hence the explicit exits
            ! touch .git/config || exit 1
            ! touch .devcontainer/x || exit 1
            command -v fdfind
            fish -c "type -q fd"
            cargo audit --version
            cargo nextest --version
            zizmor --version
            # the default Python must be a final release: an outdated uv installs a pre-release
            # of a newer series, where packages with compiled extensions can fail to load
            python3 -c "import sys; assert sys.version_info.releaselevel == \"final\", sys.version"
            hcli --version
            # IDA itself is installed by users, at the paths that idalib expects by default, so the
            # template must not set IDADIR (see the README)
            test -z "${IDADIR:-}"
            # the install commands of the README, with empty stand-ins for the installer and the license
            # (a dry run, since installing needs a real installer)
            touch /tmp/ida-pro_95_armlinux.run /tmp/idapro_00-0000-0000-00.hexlic
            hcli license install /tmp/idapro_00-0000-0000-00.hexlic ~/.idapro
            test -f ~/.idapro/idapro_00-0000-0000-00.hexlic
            hcli ida install --dry-run --yes --install-dir ~/ida-pro-9.5 /tmp/ida-pro_95_armlinux.run
            # no grep -q: exiting at the first match can break the rustup output under pipefail
            # (and no apostrophes in this script: it is single-quoted)
            rustup target list --installed | grep -Fx wasm32-wasip2 >/dev/null
            git lfs version
            clang --version
            # bindgen loads libclang at run time and parses C++ headers like this
            ls /usr/lib/llvm-*/lib/libclang.so >/dev/null
            echo "#include <string>" | clang++ -xc++ -std=c++17 -fsyntax-only -
          '
      - name: check network isolation
        run: |
          set -euxo pipefail
          ws="$RUNNER_TEMP/ws"
          # sends an Ethernet frame to 1.1.1.1 with a packet socket (NET_RAW), which skips the IP
          # stack, and checks the result given: "sent", or "blocked" by the egress filter (ENOBUFS)
          probe='
          import errno, socket, sys
          s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW)
          s.bind(("eth0", 0))
          ip = bytes.fromhex("4500001c000100004001" "0000" "0a000001" "01010101")
          try:
              s.send(b"\xff" * 6 + b"\x02" * 6 + b"\x08\x00" + ip + bytes(8))
              result = "sent"
          except OSError as e:
              if e.errno != errno.ENOBUFS:
                  raise
              result = "blocked"
          print(result)
          sys.exit(result != sys.argv[1])
          '
          # twice: locking again replaces the rules (to refresh addresses)
          ./install.sh net lock "$ws"
          ./install.sh net lock "$ws"
          ./install.sh net status "$ws" | grep -F "is locked"
          # shellcheck disable=SC2016 # expanded by the container's bash, not here
          devcontainer exec --workspace-folder "$ws" bash -c '
            set -euxo pipefail
            test "$(curl -s -o /dev/null -w "%{http_code}" -m 10 https://api.anthropic.com/)" != 000
            git ls-remote https://github.com/0xdea/zed-claude-devcontainer HEAD
            # set -e ignores commands negated with !, hence the explicit exits
            ! curl -s -m 10 https://example.com || exit 1
            # DNS only to the resolvers Docker set
            ! dig +time=2 +tries=1 @9.9.9.9 example.com || exit 1
            ! sudo nft flush ruleset || exit 1
            sudo python3 -c "$1" blocked
          ' _ "$probe"
          ./install.sh net unlock "$ws"
          ./install.sh net status "$ws" | grep -F "is unlocked"
          # shellcheck disable=SC2016 # expanded by the container's bash, not here
          devcontainer exec --workspace-folder "$ws" bash -c '
            set -euxo pipefail
            curl -sf -o /dev/null -m 10 https://example.com
            sudo python3 -c "$1" sent
          ' _ "$probe"
      - name: check network isolation edge cases
        run: |
          set -euxo pipefail
          ws="$RUNNER_TEMP/ws"
          allow="$ws/.devcontainer/net-allow"
          in_ws() { devcontainer exec --workspace-folder "$ws" bash -c "$1"; }

          # net-allow: its entries are allowed and listed, other hosts stay blocked
          printf "# extra hosts\nexample.com\n" >"$allow"
          ./install.sh net lock "$ws" | grep -F "from .devcontainer/net-allow: example.com"
          in_ws "curl -sf -o /dev/null -m 10 https://example.com"
          # set -e ignores commands negated with !, hence the explicit exits
          ! in_ws "curl -s -m 10 https://wikipedia.org" || exit 1
          # a bad line fails with its line number
          printf "example.com\nexample.com pypi.org\n" >"$allow"
          ! ./install.sh net lock "$ws" 2>"$RUNNER_TEMP/err" || exit 1
          grep -F "net-allow:2:" "$RUNNER_TEMP/err"
          rm "$allow"
          ./install.sh net unlock "$ws"

          # devc net finds containers by this label, so throwaway containers from the image
          # stand in for devcontainers created with other settings
          image=$(docker inspect --format "{{.Image}}" \
            "$(docker ps -q --filter "label=devcontainer.local_folder=$ws")")
          throwaway() {
            local name="$1"
            shift
            mkdir -p "$RUNNER_TEMP/$name"
            docker run -d --rm --name "$name" --label "devcontainer.local_folder=$RUNNER_TEMP/$name" \
              --entrypoint sleep "$@" "$image" infinity
          }

          # host networking is refused, leaving the runner online
          throwaway hostnet --network host
          ! ./install.sh net lock "$RUNNER_TEMP/hostnet" || exit 1
          curl -sf -o /dev/null -m 10 https://example.com

          # with NET_ADMIN, locking warns that the container can undo it
          throwaway netadmin --cap-add NET_ADMIN
          ./install.sh net lock "$RUNNER_TEMP/netadmin" | grep -F "can undo it"

          # DNS servers set with --dns stay reachable, others are blocked
          throwaway dns --dns 1.1.1.1
          ./install.sh net lock "$RUNNER_TEMP/dns"
          docker exec dns getent hosts example.com
          ! docker exec dns dig +time=2 +tries=1 @9.9.9.9 example.com || exit 1

          docker rm -f hostnet netadmin dns

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
